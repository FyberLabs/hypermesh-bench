  A Product-2 row is one artifact: one file hash, one quant, one loader,
  one backend, one class, one power profile, one advertised context, one
  measured envelope. Usable RAM on Orin UMA is the limiter. Soak must
  measure usable_ram before treating 4096 (or any higher ctx) as a fit.
  Same artifact on two images is two products.

